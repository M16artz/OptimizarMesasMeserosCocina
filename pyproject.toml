[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurante-sim"
version = "0.1.0"
description = "Simulación de eventos discretos de mesas, meseros y cocineros en un restaurante"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "simpy",
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "pyyaml",
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
restaurante-sim = "restaurante.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
